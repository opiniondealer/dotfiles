# Monitor layout — Triple Monitor (Workstation / Serialchiller)
# Fisik: laptop di BAWAH-tengah, 2 monitor eksternal di ATAS.
#
# Pakai desc: (bukan nama port) buat monitor eksternal, karena nama port
# berubah-ubah tergantung dock/port USB-C yang dipakai:
#   - session lama: DP-2
#   - session sekarang: DP-1
# desc = make + model + serial, jadi tiap monitor fisik selalu dapat posisi
# yang sama walaupun port-nya beda.
#
# Layout (koordinat logical):
#   HDMI-LG (0-1920)   DP-LG (1920-3840)   <- atas
#          eDP-1 (480-3360)                <- bawah (laptop)

# Eksternal kiri-atas (LG ULTRAGEAR, serial ...212NTEP41372)
monitor = desc:LG Electronics LG ULTRAGEAR 212NTEP41372, 1920x1080@143.98, 0x0, 1.0

# Eksternal kanan-atas (LG ULTRAGEAR, serial ...211NTZN9E973)
monitor = desc:LG Electronics LG ULTRAGEAR 211NTZN9E973, 1920x1080@120.00, 1920x0, 1.0

# Laptop di bawah-tengah (X=480 biar center dari 3840 total lebar atas)
monitor = eDP-1, 2880x1800@60.07, 480x1080, 1.0

# Fallback kalau ada monitor lain (jangan auto: bikin gap)
monitor = , preferred, 0x0, auto