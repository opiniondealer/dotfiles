# judul
label {
    monitor =
    text = cmd[] echo "Authenticate into $(hostname)"
    color = rgba(200, 200, 200, 1)
    font_size = 13
    font_family = Noto Sans
    halign = center
    valign = center
    position = -108, 51
}

# username
label {
    monitor =
    text = <b>Username: $USER</b>
    color = rgba(200, 200, 200, 1)
    font_size = 13
    font_family = Noto Sans
    halign = center
    valign = center
    position = -165, 15
}

# password (label)
label {
    monitor =
    text = <b>Password:</b>
    color = rgba(200, 200, 200, 1)
    font_size = 13
    font_family = Noto Sans
    halign = center
    valign = center
    position = -189, -15
}

# input password, tampil sensor "*"
input-field {
    monitor =
    size = 300, 24
    outline_thickness = 0
    inner_color = rgba(0, 0, 0, 0)
    outer_color = rgba(0, 0, 0, 0)
    font_color = rgba(200, 200, 200, 1)
    check_color = rgba(0, 0, 0, 0)
    fail_color = rgba(0, 0, 0, 0)
    font_family = Noto Sans
    dots_text_format = *
    dots_size = 0.3
    dots_spacing = 0.1
    dots_center = false
    fade_on_empty = false
    placeholder_text =
    fail_text =
    halign = center
    valign = center
    position = 15, -15
}
