general {
    hide_cursor = true
}

background {
    monitor =
    path = /home/abay/.cache/current_wallpaper
    color = rgba(0, 0, 0, 1)
    blur_passes = 2
    brightness = 0.5
}

# tanggal & jam (atas)
label {
    monitor =
    text = cmd[update:1000] date '+%A, %B %d - %H:%M'
    color = rgba(200, 200, 200, 1)
    font_size = 16
    font_family = Noto Sans
    halign = center
    valign = top
    position = 0, -28
}

# border: kiri, kanan, bawah
shape {
    monitor =
    size = 2, 104
    color = rgba(255, 255, 255, 1)
    rounding = 0
    border_size = 0
    halign = center
    valign = center
    position = -251, 0
}
shape {
    monitor =
    size = 2, 104
    color = rgba(255, 255, 255, 1)
    rounding = 0
    border_size = 0
    halign = center
    valign = center
    position = 251, 0
}
shape {
    monitor =
    size = 504, 2
    color = rgba(255, 255, 255, 1)
    rounding = 0
    border_size = 0
    halign = center
    valign = center
    position = 0, -51
}

# border atas: 2 segmen, celah buat judul
shape {
    monitor =
    size = 20, 2
    color = rgba(255, 255, 255, 1)
    rounding = 0
    border_size = 0
    halign = center
    valign = center
    position = -242, 51
}
shape {
    monitor =
    size = 232, 2
    color = rgba(255, 255, 255, 1)
    rounding = 0
    border_size = 0
    halign = center
    valign = center
