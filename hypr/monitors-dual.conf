# Monitor layout — Dual (laptop + 1 eksternal atas)
# Ukuran mengikuti profil triple: laptop scale 1.0, eksternal 1080p scale 1.0.
# Eksternal atas-tengah, laptop di bawah menjorok tengah (mirip setup triple).
#
# Pakai desc: untuk eksternal agar tiap layar fisik dapat posisi yang sama
# walaupun nama port (DP-1/DP-2/HDMI-A-1) berubah mengikuti dock.

# Eksternal atas-tengah (LG ULTRAGEAR, serial ...212NTEP41372)
monitor = desc:LG Electronics LG ULTRAGEAR 212NTEP41372, 1920x1080@143.98, 480x0, 1.0
# Fallback eksternal lain (serial beda): tetap atas-tengah
monitor = , preferred, 480x0, 1.0

# Laptop di bawah-tengah (X=480 biar center terhadap lebar eksternal)
monitor = eDP-1, 2880x1800@60.07, 0x1080, 1.0
