# Hyprland config — Serialchiller theme
# Ported from sway config (~/.config/sway/config) during Debian 13 migration
# Original stub backed up at: hyprland.conf.stub-backup

# --- Variables ---
$mainMod = SUPER
$term = kitty
$menu = wofi --normal-window --conf $HOME/.config/wofi/drun.conf
$browser = brave-browser
$filemanager = nautilus
$editor = nvim
$ws = $HOME/.config/hyprdots/scripts/ws.sh

# Serialchiller colors
$bg = rgba(1e1e1eff)
$fg = rgba(ccccccff)
$accent = rgba(3b8eeaff)
$border = rgba(414140ff)
$border_active = rgba(e7e7e7ff)
$urgent = rgba(f14c4cff)

# --- Monitor ---
# Layout disimpen di monitors.conf (diedit via `nwg-displays` GUI)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf

# --- Environment ---
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

# --- Autostart ---
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = sleep 1 && waybar
exec-once = hyprpaper
exec-once = nm-applet --indicator
exec-once = /usr/libexec/hyprpolkitagent
# auto show/hide workspaces based on monitor count
# exec-once = $HOME/.config/hyprdots/scripts/hypr-monitor-listener.sh  # disabled: workspace selalu tampil

# --- Appearance ---
general {
  gaps_in = 8
  gaps_out = 8
  # border dimatikan (border_size 0) — tema flat
  border_size = 0
  col.active_border = $accent
  col.inactive_border = $border
  layout = dwindle
  resize_on_border = true
} 

decoration {
  rounding = 4
  active_opacity = 0.9
  inactive_opacity = 0.9

  blur {
    enabled = true
    size = 4
    passes = 2
    new_optimizations = true
  } 

  shadow {
    enabled = true
    range = 12
    render_power = 3
    color = rgba(00000055)
  } 
} 

animations {
  enabled = true
  bezier = easeOut, 0.05, 0.9, 0.1, 1.05
  animation = windows, 1, 3, easeOut
  animation = windowsOut, 1, 3, easeOut, popin 80%
  animation = fade, 1, 3, easeOut
  animation = workspaces, 1, 3, easeOut, slide
} 

dwindle {
  preserve_split = true
} 

master {
  new_status = master
} 

misc {
  force_default_wallpaper = 0
  disable_hyprland_logo = true
  focus_on_activate = true
  # Do not drag the pointer onto another monitor just because a window
  # there grabbed focus (e.g. an incoming chat notification).
  mouse_move_focuses_monitor = false
}

cursor {
  # Never warp the pointer as a side effect of focus/workspace changes.
  # Without this, activating a window on another monitor (chat
  # notification, xdg-activation) yanks the cursor across screens.
  no_warps = true
  warp_on_change_workspace = 0
  persistent_warps = false
} 

# --- Input ---
input {
  kb_layout = us
  kb_options = compose:caps
  follow_mouse = 1
  sensitivity = 0

  touchpad {
    natural_scroll = true
    tap-to-click = true
  } 
} 

# --- Window rules ---
# (suppressevent rule removed - not supported in Hyprland 0.55)

# --- Hotkeys (ported from sway config) ---

# --- Alt+Tab: native window switching ---
# binde = repeat, biar bisa tahan-tahan (Alt ditahan, Tab ditekan berulang)
binde = ALT, Tab, cyclenext
binde = ALT, Tab, bringactivetotop
binde = ALT SHIFT, Tab, cyclenext, prev
binde = ALT SHIFT, Tab, bringactivetotop
# Alt + ` = pindah ke window terakhir (toggle)
bind = ALT, grave, focuscurrentorlast
# Super+Tab: window switcher
bind = $mainMod, Tab, cyclenext

# GUI settings
bind = $mainMod SHIFT, M, exec, nwg-displays
bind = $mainMod, slash, exec, $HOME/.config/hyprdots/scripts/shortcuts.sh

# Terminal
bind = $mainMod, Return, exec, $term
bind = CTRL ALT, T, exec, $term

# Tmux
bind = $mainMod ALT, Return, exec, $term bash -c "tmux attach || tmux new -s Work"

# Close window
bind = $mainMod, W, killactive,

# Maximize / fullscreen
bind = $mainMod, F, fullscreen, 1

# Resize mode
bind = $mainMod, BackSpace, submap, resize
submap = resize
binde = , right, resizeactive, 20 0
binde = , left, resizeactive, -20 0
binde = , up, resizeactive, 0 -20
binde = , down, resizeactive, 0 20
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset

# Launcher
bind = $mainMod, Space, exec, $menu

# Lock screen
bind = $mainMod, L, exec, hyprlock

# Browser
bind = SHIFT $mainMod, B, exec, $browser
bind = SHIFT $mainMod, Return, exec, $browser
bind = SHIFT ALT $mainMod, B, exec, $browser --incognito

# File manager
bind = SHIFT $mainMod, F, exec, $filemanager --new-window

# Editor
bind = SHIFT $mainMod, N, exec, $term -e $editor

# Activity monitor (btop)
bind = SHIFT $mainMod, T, exec, $term -e btop

# Docker (lazydocker)
bind = SHIFT $mainMod, D, exec, $term -e lazydocker

# Screenshots — grim + slurp (wayland native)
bind = , Print, exec, grim -g "$(slurp)" ~/Pictures/screenshots/$(date +%Y%m%d-%H%M%S).png
bind = CTRL, Print, exec, grim - | wl-copy
bind = SHIFT, Print, exec, grim -o $(hyprctl monitors -j | jq -r '.[] | select(.focused) | .name') ~/Pictures/screenshots/$(date +%Y%m%d-%H%M%S).png
# select area -> save file + copy clipboard
bind = $mainMod SHIFT, S, exec, sh -c 'f="$HOME/Pictures/screenshots/$(date +%Y%m%d-%H%M%S).png"; grim -g "$(slurp)" "$f" && wl-copy < "$f" && notify-send -t 2000 "Screenshot" "Saved + copied: $(basename $f)"'

# Workspace switching — per-monitor named workspaces
# A = eDP-1 (laptop), B = HDMI-A-1 (kiri), C = DP-2 (kanan)
# ws.sh auto-detects the focused monitor, so Super+1 always means
# "workspace 1 on this screen".
bind = $mainMod, 1, exec, $ws switch 1
bind = $mainMod, 2, exec, $ws switch 2
bind = $mainMod, 3, exec, $ws switch 3
bind = $mainMod, 4, exec, $ws switch 4
bind = $mainMod, 5, exec, $ws switch 5
bind = $mainMod, 6, exec, $ws switch 6

# Move window to workspace on the current monitor (follows the window)
bind = $mainMod SHIFT, 1, exec, $ws move 1
bind = $mainMod SHIFT, 2, exec, $ws move 2
bind = $mainMod SHIFT, 3, exec, $ws move 3
bind = $mainMod SHIFT, 4, exec, $ws move 4
bind = $mainMod SHIFT, 5, exec, $ws move 5
bind = $mainMod SHIFT, 6, exec, $ws move 6

# Move window to workspace silently (stay on current workspace)
bind = $mainMod CTRL, 1, exec, $ws moveto 1
bind = $mainMod CTRL, 2, exec, $ws moveto 2
bind = $mainMod CTRL, 3, exec, $ws moveto 3
bind = $mainMod CTRL, 4, exec, $ws moveto 4
bind = $mainMod CTRL, 5, exec, $ws moveto 5
bind = $mainMod CTRL, 6, exec, $ws moveto 6

# Cycle workspaces on the focused monitor
bind = $mainMod, mouse_down, exec, $ws cycle +1
bind = $mainMod, mouse_up, exec, $ws cycle -1

# Focus direction
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Down, movefocus, d
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Right, movefocus, r

# Move window direction
bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Down, movewindow, d
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Right, movewindow, r

# Resize langsung (tanpa masuk submap) — Super+Ctrl+Arrow
binde = $mainMod CTRL, Left, resizeactive, -20 0
binde = $mainMod CTRL, Right, resizeactive, 20 0
binde = $mainMod CTRL, Up, resizeactive, 0 -20
binde = $mainMod CTRL, Down, resizeactive, 0 20

# Toggle floating
bind = $mainMod SHIFT, Space, togglefloating,

# --- Mouse: drag & resize window ---
# Super + klik kiri tahan = geser window (bikin floating otomatis kalo tiling)
bindm = $mainMod, mouse:272, movewindow
# Super + klik kanan tahan = resize window
bindm = $mainMod, mouse:273, resizewindow
# Super + scroll = zoom in/out window (resize)
binde = $mainMod, mouse_down, resizeactive, 30 30
binde = $mainMod, mouse_up, resizeactive, -30 -30

# Split orientation (dari sway: Super+V = split v, Super+H = split h)
bind = $mainMod, V, layoutmsg, togglesplit
bind = $mainMod, H, layoutmsg, swapsplit

# Reload config
bind = $mainMod SHIFT, C, exec, hyprctl reload

# Exit Hyprland (back to greeter)
bind = $mainMod SHIFT, E, exec, hyprctl dispatch exit

# Volume control
binde = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
binde = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# Brightness
binde = , XF86MonBrightnessUp, exec, brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ===== Max window size (samain lebar bar: 2864px) =====
misc {
  size_limits_tiled = true
} 
windowrule = size 2864 1700, match:class .*

# Slider/popup yad -> floating, ukuran tetap
windowrule = float on, match:class ^(yad|Yad)$
windowrule = size 400 150, match:class ^(yad|Yad)$
windowrule = center on, match:class ^(yad|Yad)$

# Audio panel (GTK4) -> floating, centered, no decoration
windowrule = float on, match:title ^(audio-panel)$
windowrule = center on, match:title ^(audio-panel)$

# Brightness panel (GTK4) -> floating, centered
windowrule = float on, match:title ^(brightness-panel)$
windowrule = center on, match:title ^(brightness-panel)$

# WiFi + shortcuts panels (GTK4) -> floating, centered
windowrule = float on, match:title ^(wifi-panel|shortcuts-panel)$
windowrule = center on, match:title ^(wifi-panel|shortcuts-panel)$

# wofi with --normal-window -> floating popup, no tiling, no border
windowrule = float on, match:class ^(wofi)$
windowrule = center on, match:class ^(wofi)$
windowrule = border_size 0, match:class ^(wofi)$
