# Monitor layout — serialchiller
# Fisik: laptop di BAWAH-tengah, 2 monitor eksternal di ATAS
#
# Layout (koordinat logical):
#   HDMI (0-1920)   DP (1920-3840)      <- atas
#         eDP (480-3360)                <- bawah (laptop, scale 1.0)
#
# Catatan: eDP scale 1.0 -> logical 2880px. Nutup 2880 dari 3840px total
# monitor atas, jadi cuma 480px pinggir kiri/kanan yang ga nyambung.
# Kalo mau ZERO nabrak: scale 0.75 (logical 3840, pas nutup semua).

# Eksternal kiri-atas
monitor = HDMI-A-1, 1920x1080@143.98, 0x0, 1.0

# Eksternal kanan-atas
monitor = DP-2, 1920x1080@120.00, 1920x0, 1.0

# Laptop, di bawah-tengah. X=480 biar center dari 3840.
monitor = eDP-1, 2880x1800@60.07, 480x1080, 1.0

# Fallback kalau monitor belum dikenal
monitor = , preferred, auto, auto
