# Per-monitor named workspaces (startup assignment)
#
# Setiap monitor punya set workspace sendiri dengan prefix berbeda:
#   eDP-1    (laptop)         -> A1 A2 A3 A4
#   HDMI-A-1 (eksternal kiri) -> B1 B2 B3 B4
#   DP-2     (eksternal kanan)-> C1 C2 C3 C4
#
# Keybind Super+1..4 jalan lewat ws.sh yang auto-detect monitor fokus,
# jadi Super+1 = "workspace 1 di layar ini".
#
# Rule di sini nge-assign default workspace pas startup biar ga balik ke
# numeric polos (1 2 3) abis logout/restart.
#
# Catatan:
# - default:true  -> monitor ini start di workspace tsb.
# - TANPA persistent:true -> biar ga muncul workspace hantu di bar pas
#   monitor eksternal dicabut (bar jadi bersih otomatis).
# - Rule utk monitor yang ga exist di-skip sama Hyprland (no error).

# --- eDP-1 (laptop) ---
workspace = name:A1, monitor:eDP-1, default:true
workspace = name:A2, monitor:eDP-1
workspace = name:A3, monitor:eDP-1
workspace = name:A4, monitor:eDP-1

# --- HDMI-A-1 (eksternal kiri) ---
workspace = name:B1, monitor:HDMI-A-1, default:true
workspace = name:B2, monitor:HDMI-A-1
workspace = name:B3, monitor:HDMI-A-1
workspace = name:B4, monitor:HDMI-A-1

# --- DP-2 (eksternal kanan) ---
workspace = name:C1, monitor:DP-2, default:true
workspace = name:C2, monitor:DP-2
workspace = name:C3, monitor:DP-2
workspace = name:C4, monitor:DP-2