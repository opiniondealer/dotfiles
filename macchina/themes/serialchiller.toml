# Serialchiller - VSCode Dark palette
# matches kitty/btop/macchina/p10k serialchiller themes

spacing         = 2
padding         = 1
hide_ascii      = false
separator       = "→"
key_color       = "#29b8db"
separator_color = "#666666"

[palette]
type = "Full"
visible = false

[bar]
glyph           = "●"
symbol_open     = '('
symbol_close    = ')'
hide_delimiters = true
visible         = false

[box]
border          = "plain"
visible         = true

[box.inner_margin]
x               = 2
y               = 0

[randomize]
key_color       = false
separator_color = false

[custom_ascii]
path            = "~/development/dotfiles/macchina/ascii/logo.ascii"

[keys]
host            = "Host"
kernel          = "Kernel"
battery         = "Battery"
os              = "OS"
de              = "DE"
wm              = "WM"
distro          = "Distro"
terminal        = "Terminal"
shell           = "Shell"
packages        = "Packages"
uptime          = "Uptime"
memory          = "Memory"
machine         = "Machine"
local_ip        = "Local IP"
backlight       = "Brightness"
resolution      = "Resolution"
cpu_load        = "CPU Load"
cpu             = "CPU"
gpu             = "GPU"
disk_space      = "Disk Space"
