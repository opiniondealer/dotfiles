# Appearance
hide_window_decorations yes 

# background #2f323f
# foreground #ffffff
# cursor #f81ce5
cursor_shape block
cursor_blink_interval 0

# Shell
shell /usr/bin/zsh

# Font
font_family Ubuntu Mono
font_size 11.0

# Padding
window_padding_width 20 20
window_margin_width 0

# Keybindings
map ctrl+d launch --location=vsplit
map ctrl+shift+d launch --location=hsplit
map ctrl+w close_window
map ctrl+t new_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map ctrl+shift+alt+left  move_window_to_screen left
map ctrl+shift+alt+right move_window_to_screen right

paste_actions no-op

# BEGIN_KITTY_THEME
include themes/serialchiller.conf
# END_KITTY_THEME

# Transparency
background_opacity 1.0

# Tab bar
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge bottom
tab_bar_min_tabs 1
tab_activity_symbol none
tab_bar_margin_color none
