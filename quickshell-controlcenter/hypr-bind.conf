# Quickshell Control Center keybind
#
# Paste this line into ~/.config/hypr/hyprland.conf, then run: hyprctl reload
#
# SUPER + C  -> toggle the Control Center panel
#
# The shell must already be running. It is managed by the user service:
#   systemctl --user status quickshell-controlcenter
#   systemctl --user restart quickshell-controlcenter

bind = $mainMod, C, exec, quickshell ipc -p ~/.config/quickshell-controlcenter call controlcenter toggle